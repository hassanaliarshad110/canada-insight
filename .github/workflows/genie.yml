name: Research assistant

# Deploys the assistant (worker/genie.js) to Cloudflare Workers. The Claude key goes from this repository's secret
# straight into Cloudflare's secret store; it never reaches the website.
#
# Repository secrets needed: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID,
# ANTHROPIC_API_KEY. Optional: GENIE_ACCESS_CODE (visitors must type it).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/genie.yml']

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        run: |
          missing=""
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ] || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing"; exit 1; fi
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install -g wrangler@4
      - name: Daily limit counters (create once)
        working-directory: worker
        run: |
          id=$(wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const n=a.find(x=>x.title.endsWith('LIMITS'));console.log(n?n.id:'')})")
          if [ -z "$id" ]; then
            wrangler kv namespace create LIMITS
            id=$(wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const n=a.find(x=>x.title.endsWith('LIMITS'));console.log(n?n.id:'')})")
          fi
          printf '\n[[kv_namespaces]]\nbinding = "LIMITS"\nid = "%s"\n' "$id" >> wrangler.toml
      - name: Deploy
        id: deploy
        working-directory: worker
        run: |
          wrangler deploy | tee deploy.log
          url=$(grep -o 'https://[a-zA-Z0-9.-]*workers.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Put the key (and optional access code) in Cloudflare's secret store
        working-directory: worker
        run: |
          printf '%s' "${{ secrets.ANTHROPIC_API_KEY }}" | wrangler secret put ANTHROPIC_API_KEY
          if [ -n "${{ secrets.GENIE_ACCESS_CODE }}" ]; then printf '%s' "${{ secrets.GENIE_ACCESS_CODE }}" | wrangler secret put ACCESS_CODE; fi
      - name: Tell the website where the assistant is
        run: |
          code=false; [ -n "${{ secrets.GENIE_ACCESS_CODE }}" ] && code=true
          printf '{"url": "%s", "needs_code": %s}\n' "${{ steps.deploy.outputs.url }}" "$code" > site/genie.json
          if ! git diff --quiet -- site/genie.json; then
            git config user.name 'canada-insight build'
            git config user.email 'actions@users.noreply.github.com'
            git add site/genie.json
            git commit -m 'Research assistant address'
            git push
            gh workflow run build.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
